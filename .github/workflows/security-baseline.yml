name: Security checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked sensitive files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          blocked = []
          for value in filter(None, paths):
              name = pathlib.PurePosixPath(value).name.lower()
              template = name.endswith(('.example', '.sample', '.template'))
              env = (name == '.env' or name.startswith('.env.')) and not template
              key = name.endswith(('.key', '.p12', '.pfx')) or name in ('id_rsa', 'id_ed25519', '.credentials')
              if env or key:
                  blocked.append(value)
          if blocked:
              print('::error::Sensitive-file policy failed. Review tracked environment/key files privately; no file contents are logged.')
              sys.exit(1)
          print('Sensitive-file policy passed.')
          PY
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$RUNNER_TEMP/security-baseline"
          mkdir -p "$scan_dir"
          curl --fail --location --retry 3 --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/config.toml"
          : > "$scan_dir/empty-ignore"
      - name: Scan reachable Git history without disclosing matches
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$RUNNER_TEMP/security-baseline"
          if ! "$scan_dir/gitleaks" git . --log-opts="--all" \
            --config "$scan_dir/config.toml" \
            --gitleaks-ignore-path "$scan_dir/empty-ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color \
            --timeout 240 --max-archive-depth 2 --log-level fatal > /dev/null 2>&1; then
            echo '::error::Secret scan failed or found a potential secret. Stop and investigate privately. Never paste matching values into logs, issues or PRs.'
            exit 1
          fi
          echo 'Secret scan passed.'
